chunking:
  chunk_size: 512
  chunk_overlap: 64

embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
reranker_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"

retrieval:
  dense_top_k: 20
  bm25_top_k: 20
  hybrid_alpha: 0.5   # weight on dense score vs bm25 score
  rerank_top_k: 5

generation:
  backend: "local"
  model: "gpt-4o-mini"
  generation:
  local_model: "Qwen/Qwen2.5-0.5B-Instruct"
  max_tokens: 512
  temperature: 0.1
