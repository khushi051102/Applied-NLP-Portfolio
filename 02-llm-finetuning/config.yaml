base_model: "Qwen/Qwen2.5-1.5B-Instruct"   # matches base model used in 01-rag-system and 03-agentic-chatbot

quantization:
  load_in_4bit: true
  bnb_4bit_quant_type: "nf4"
  bnb_4bit_compute_dtype: "bfloat16"
  bnb_4bit_use_double_quant: true

lora:
  r: 16
  lora_alpha: 32
  lora_dropout: 0.05
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  task_type: "CAUSAL_LM"

training:
  num_train_epochs: 6          # bumped from 3 -> dataset is small (~400 train examples), a few more
                                # passes helps the model reliably lock onto the JSON output format
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 4
  learning_rate: 2.0e-4  # must have a decimal point, PyYAML parses "2e-4" as a string
  warmup_ratio: 0.03
  logging_steps: 10
  save_strategy: "epoch"
